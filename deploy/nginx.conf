server {
    listen 80;
    server_name duyuxiang.cn www.duyuxiang.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name duyuxiang.cn www.duyuxiang.cn;

    ssl_certificate /etc/letsencrypt/live/duyuxiang.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duyuxiang.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/lingguang/site;
    index index.html;

    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /version.json { add_header Cache-Control "no-cache"; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /downloads/ {
        alias /var/www/lingguang/downloads/;
        add_header Content-Disposition "attachment";
        sendfile on;
        tcp_nopush on;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 500M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    error_page 404 /index.html;
}
